version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tracer-study-app
    container_name: tracer-study-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - tracer-study-network

  web:
    image: nginx:alpine
    container_name: tracer-study-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - tracer-study-network

networks:
  tracer-study-network:
    driver: bridge
